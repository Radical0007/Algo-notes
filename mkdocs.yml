site_name: Algo Notes
site_url: https://radical0007.github.io/Algo-notes/
site_description: 算法题解、竞赛模板、专题训练与比赛复盘。

repo_url: https://github.com/Radical0007/Algo-notes
repo_name: Radical0007/Algo-notes
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  font: false
  favicon: assets/images/favicon.svg
  icon:
    logo: fontawesome/solid/code
    repo: fontawesome/brands/github
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统主题
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: false
      title: 本页目录
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Radical0007
      name: Radical0007 on GitHub

copyright: Copyright &copy; 2026 Algo Notes.

not_in_nav: |
  solutions/**/*.md
  !solutions/**/index.md

nav:
  - 首页: index.md

  - 刷题题解:
      - 题解总览: solutions/index.md
      - Codeforces: solutions/codeforces/index.md
      - 牛客: solutions/nowcoder/index.md
      - 洛谷: solutions/luogu/index.md
      - 码蹄集: solutions/matiji/index.md
      - ACWing: solutions/acwing/index.md
      - 其他: solutions/others/index.md

  - 算法专题: blog/index.md
  - 算法模板: algorithm-templates/index.md
  - 专题训练: topics/index.md
  - 比赛复盘: contests/index.md
  - 站点说明: about.md
